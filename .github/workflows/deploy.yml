# Production deploy — triggered on push to `main`.
#
# IMPORTANT: this pipeline does NOT deploy the API. The API runs as an always-on
# Replit VM deployment and must be (re)published manually from the Replit
# "Publish" UI — there is no public Replit API to trigger it from CI. So the
# rollout is NOT atomic: this workflow migrates the prod DB, build-verifies the
# API, fires the three Vercel front-end deploy hooks, then smoke-tests whatever
# API is currently live. If you ship an API change, republish it on Replit.
# (See .agents/memory/deployment.md.)
#
# The flow is serial for migrate -> build-api and parallel for the three Vercel
# front-ends. Smoke tests then verify every public endpoint before posting to
# Slack (Slack failures are non-fatal).

name: Deploy (production)

on:
  push:
    branches: [main]

concurrency:
  # Never run two prod deploys at once.
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_COLOR: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ----------------------------------------------------------------------------
  # 1. Apply pending Prisma migrations to the production Supabase database.
  #    This is the gating step — if migrations fail, nothing else runs.
  # ----------------------------------------------------------------------------
  deploy-database:
    name: Migrate production DB
    runs-on: ubuntu-latest
    environment: production
    env:
      # Prisma datasource reads SUPABASE_DB_URL / SUPABASE_DIRECT_URL (see
      # prisma/schema.prisma), NOT DATABASE_URL / DIRECT_URL.
      #
      # IMPORTANT: both PROD_* secrets MUST use the Supabase *pooler* host
      # (aws-<n>-<region>.pooler.supabase.com, user `postgres.<project-ref>`),
      # NOT the direct host `db.<project-ref>.supabase.co`. The direct host is
      # IPv6-only and GitHub-hosted runners are IPv4-only, so direct-host URLs
      # fail here with `P1001: Can't reach database server`. Use the Session
      # pooler (port 5432) for PROD_DIRECT_URL — migrations need session mode —
      # and the Transaction pooler (port 6543) for PROD_DATABASE_URL.
      SUPABASE_DB_URL: ${{ secrets.PROD_DATABASE_URL }}
      SUPABASE_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply migrations
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma

  # ----------------------------------------------------------------------------
  # 2. Build-verify the API.
  #
  #    NOTE: the API is intentionally NOT deployed from this pipeline. It runs
  #    as an always-on Replit VM deployment (the BullMQ queue workers and the
  #    @Cron jobs run in-process, so it cannot scale to zero). Replit VM
  #    deployments are (re)published from the Replit "Publish" UI — there is no
  #    public Replit API to trigger a deployment from external CI, so the old
  #    `curl https://api.replit.com/v0/deployments` step could never succeed.
  #    The API rollout is therefore a manual Replit republish; see
  #    `.agents/memory/deployment.md`. This job just compiles the API so a
  #    broken build still blocks the front-end deploys below.
  # ----------------------------------------------------------------------------
  build-api:
    name: Build API (deployed separately on Replit)
    needs: [deploy-database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build API
        run: npx turbo run build --filter=@feastpot/api

  # ----------------------------------------------------------------------------
  # 3-5. Trigger Vercel deploy hooks for the three front-ends. These run in
  #      parallel with each other but are gated on `build-api` (which itself
  #      requires `deploy-database`), so a failed migration or API build
  #      blocks the frontend deploys and prevents a broken schema from
  #      reaching prod.
  # ----------------------------------------------------------------------------
  deploy-web:
    name: Deploy web (Vercel)
    needs: [build-api]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_WEB }}"

  deploy-vendor:
    name: Deploy vendor (Vercel)
    needs: [build-api]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_VENDOR }}"

  deploy-admin:
    name: Deploy admin (Vercel)
    needs: [build-api]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}"

  # ----------------------------------------------------------------------------
  # 6. Smoke tests — wait for Vercel to settle, then ping every public surface.
  # ----------------------------------------------------------------------------
  smoke-test:
    name: Smoke tests
    needs: [deploy-web, deploy-vendor, deploy-admin]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployments
        run: sleep 60
      - name: API health
        # The API exposes /healthz (liveness, returns {status,db}) — there is
        # no plain /health route, so the old path always 404'd.
        run: curl -fsS https://api.feastpot.co.uk/healthz
      - name: Customer web
        run: curl -fsS -o /dev/null https://feastpot.co.uk
      - name: Vendor portal
        run: curl -fsS -o /dev/null https://vendor.feastpot.co.uk
      - name: Admin panel
        run: curl -fsS -o /dev/null https://admin.feastpot.co.uk

  # ----------------------------------------------------------------------------
  # 7. Notify Slack on success or failure. Runs always so we get a red signal
  #    on broken deploys.
  # ----------------------------------------------------------------------------
  notify:
    name: Notify Slack
    needs: [smoke-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Success notification
        # Slack delivery must never fail the deploy: a missing/malformed
        # SLACK_WEBHOOK_URL is a notification problem, not a deploy problem.
        if: needs.smoke-test.result == 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "${SLACK_WEBHOOK_URL}" ] && { echo "::warning::SLACK_WEBHOOK_URL not set — skipping Slack notify"; exit 0; }
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":white_check_mark: Feastpot deployed successfully — commit: ${GITHUB_SHA} — by: ${GITHUB_ACTOR}\"}" \
            "${SLACK_WEBHOOK_URL}" || echo "::warning::Slack notify failed (check SLACK_WEBHOOK_URL)"
      - name: Failure notification
        if: needs.smoke-test.result != 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "${SLACK_WEBHOOK_URL}" ] && { echo "::warning::SLACK_WEBHOOK_URL not set — skipping Slack notify"; exit 0; }
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: Feastpot deploy FAILED — commit: ${GITHUB_SHA} — actor: ${GITHUB_ACTOR} — run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "${SLACK_WEBHOOK_URL}" || echo "::warning::Slack notify failed (check SLACK_WEBHOOK_URL)"
