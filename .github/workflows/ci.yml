# CI workflow — runs on every PR targeting `main` or `develop`.
#
# Each job is its own runner so they execute in parallel where possible. The
# `setup` job exists only to prime the npm + turbo caches that the other jobs
# share via `actions/cache`. Required status checks for branch protection:
# typecheck, lint, prisma-validate, test, build.

name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  # Cancel in-flight runs for the same PR when a new commit is pushed.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force colour output and a stable Turbo cache location.
  FORCE_COLOR: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ----------------------------------------------------------------------------
  # 1. Setup — install dependencies once and warm caches for downstream jobs.
  # ----------------------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pin npm (10.9.8 on the runner crashes with "Exit handler never called" on this lockfile)
        run: npm install -g npm@10.9.4

      - name: Install workspace dependencies
        # `npm ci` honours workspaces declared in the root package.json.
        run: npm ci --no-audit --no-fund

      - name: Dump npm debug log on failure
        if: failure()
        run: tail -n 200 /home/runner/.npm/_logs/*.log || true

      - name: Cache Turbo build artefacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

  # ----------------------------------------------------------------------------
  # 2. Typecheck — every workspace must satisfy `tsc --noEmit`.
  # ----------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: npm ci
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Generate Prisma client (needed for type-aware compiles)
        run: npm run db:generate
      - name: Run typecheck across all workspaces
        run: npx turbo run typecheck

  # ----------------------------------------------------------------------------
  # 3. Lint + Prettier
  # ----------------------------------------------------------------------------
  lint:
    name: Lint
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: npm ci
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: ESLint (turbo)
        run: npx turbo run lint
      - name: Commission rate literal guard
        run: node scripts/check-commission-rate-literals.mjs
      - name: Static link audit
        # Source/AST audit only: no app server or network access is required.
        run: npm run audit:links
      - name: Prettier check
        run: npm run format:check
      - name: No em-dash guard
        run: |
          if grep -rn $'\u2014' . \
            --include="*.ts" --include="*.tsx" \
            --include="*.js" --include="*.jsx" \
            --include="*.json" --include="*.md" \
            --include="*.html" --include="*.css" \
            --exclude-dir=node_modules --exclude-dir=.next \
            --exclude-dir=dist --exclude-dir=.turbo --exclude-dir=.cache \
            --exclude-dir=.git --exclude-dir=.local \
            --exclude-dir=.agents --exclude-dir=attached_assets \
            --exclude-dir=docs --exclude-dir=audit; then
            echo "ERROR: em dash (U+2014) detected. See CONTRIBUTING.md for approved alternatives."
            exit 1
          fi
      - name: No FeastPot miscapitalisation
        run: |
          if grep -rn "FeastPot" . \
            --include="*.ts" --include="*.tsx" \
            --include="*.js" --include="*.jsx" \
            --include="*.json" --include="*.md" \
            --include="*.html" --include="*.css" \
            --exclude-dir=node_modules --exclude-dir=.next \
            --exclude-dir=dist --exclude-dir=.turbo \
            --exclude-dir=.git --exclude-dir=.local \
            --exclude-dir=.agents --exclude-dir=attached_assets; then
            echo "ERROR: 'FeastPot' (wrong capitalisation) detected. The brand name is 'Feastpot'."
            exit 1
          fi
      - name: No old generic sign-up error string
        run: |
          # Spec/test files may reference the old string as a banned assertion;
          # exclude them so the guard only fires on production source.
          if grep -rn "could not create your account" . \
            --include="*.ts" --include="*.tsx" \
            --include="*.js" --include="*.jsx" \
            --exclude="*.spec.ts" --exclude="*.spec.tsx" \
            --exclude="*.test.ts" --exclude="*.test.tsx" \
            --exclude-dir=node_modules --exclude-dir=.next \
            --exclude-dir=dist --exclude-dir=.turbo \
            --exclude-dir=.git --exclude-dir=.local \
            --exclude-dir=.agents --exclude-dir=attached_assets; then
            echo "ERROR: old generic sign-up error string detected in source."
            echo "Use a specific error code in AUTH_ERROR_MAP (apps/web/src/lib/auth/auth-errors.ts) instead."
            exit 1
          fi
      - name: Refund-path invariant guard
        # Ensures all Stripe refund SDK calls are inside StripeService, and all
        # this.stripe.refund() calls are inside PaymentsService only.  Any new
        # direct refund path bypasses commission reversal, allowance restoration,
        # the Refund record, and the AuditLog - this guard prevents the regression.
        run: node scripts/check-refund-paths.mjs

  # --------------------------------------------------------------------------
  # Static discovery catches source mistakes; this companion check proves each
  # discovered internal target is served by the three local Next applications.
  # It intentionally uses only loopback URLs and does not need auth or network.
  # --------------------------------------------------------------------------
  link-audit-live:
    name: Link audit (live internal routes)
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINK_AUDIT_WEB_BASE_URL: http://127.0.0.1:3000
      LINK_AUDIT_VENDOR_BASE_URL: http://127.0.0.1:3002
      LINK_AUDIT_ADMIN_BASE_URL: http://127.0.0.1:3003
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-link-audit-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: npm ci --no-audit --no-fund
      - name: Serve applications and audit every internal target
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          cleanup() {
            kill "${pids[@]}" 2>/dev/null || true
            wait "${pids[@]}" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          npm run dev --workspace=@feastpot/web >/tmp/link-audit-web.log 2>&1 & pids+=($!)
          npm run dev --workspace=@feastpot/vendor >/tmp/link-audit-vendor.log 2>&1 & pids+=($!)
          npm run dev --workspace=@feastpot/admin >/tmp/link-audit-admin.log 2>&1 & pids+=($!)
          for url in "$LINK_AUDIT_WEB_BASE_URL" "$LINK_AUDIT_VENDOR_BASE_URL" "$LINK_AUDIT_ADMIN_BASE_URL"; do
            for attempt in $(seq 1 90); do
              curl --fail --silent --output /dev/null "$url" && break
              [ "$attempt" -eq 90 ] && { echo "Timed out waiting for $url"; exit 1; }
              sleep 2
            done
          done
          npm run audit:links:live

  # ----------------------------------------------------------------------------
  # 4. Prisma schema validation, format check, and drift gate.
  #    Runs BEFORE the test job so a drift failure aborts the run before
  #    migrations are applied to the test database.
  # ----------------------------------------------------------------------------
  prisma-validate:
    name: Prisma validate + drift check
    needs: [setup]
    runs-on: ubuntu-latest
    # A real Postgres service is required for the drift check (prisma migrate diff
    # applies all migrations to the shadow database and diffs the result against
    # schema.prisma).  validate/format steps do not connect but work fine regardless.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feastpot
          POSTGRES_PASSWORD: feastpot
          POSTGRES_DB: feastpot_validate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feastpot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_DB_URL: postgresql://feastpot:feastpot@localhost:5432/feastpot_validate?schema=public
      SUPABASE_DIRECT_URL: postgresql://feastpot:feastpot@localhost:5432/feastpot_validate?schema=public
      SHADOW_DATABASE_URL: postgresql://feastpot:feastpot@localhost:5432/feastpot_shadow?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: npm ci
      - name: Validate schema
        run: npx prisma validate --schema=./prisma/schema.prisma
      - name: Schema is correctly formatted
        # `--check` exits non-zero when the file would be reformatted.
        run: npx prisma format --schema=./prisma/schema.prisma --check
      - name: Create Supabase roles for drift check
        # Postgres roles are cluster-level — creating them once in any database
        # makes them available in the shadow DB that Prisma creates and manages.
        # This is the same set of roles that the test job creates for migrate deploy.
        run: |
          PGPASSWORD=feastpot psql -h localhost -U feastpot -d feastpot_validate \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;
                CREATE ROLE authenticated NOLOGIN;
                CREATE ROLE service_role NOLOGIN;
                CREATE ROLE supabase_auth_admin NOLOGIN;"
      - name: Create shadow database for drift check
        # Prisma's migrate diff needs an empty database to replay migrations into.
        # The Postgres service only auto-creates feastpot_validate; create the
        # shadow database manually so Prisma doesn't get P1003.
        run: |
          PGPASSWORD=feastpot psql -h localhost -U feastpot -d feastpot_validate \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE feastpot_shadow;"
      - name: Drift check — migrations must reproduce schema.prisma exactly
        # Exit 1 means prisma/migrations does not reproduce prisma/schema.prisma.
        # Root cause: a schema change was applied with `prisma db push` (no migration
        # file produced) or a migration file was hand-edited after being applied.
        # To investigate locally:
        #   npx prisma migrate diff \
        #     --from-migrations ./prisma/migrations \
        #     --to-schema-datamodel ./prisma/schema.prisma \
        #     --shadow-database-url <local-empty-postgres-url> --exit-code
        # See docs/db-push-ban.md for the approved schema-change workflow.
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  # ----------------------------------------------------------------------------
  # 5. Test — runs Jest/Vitest with coverage. Uses a Neon test branch URL
  #    provided via secrets so integration tests can hit a real Postgres.
  # ----------------------------------------------------------------------------
  test:
    name: Test (coverage thresholds)
    needs: [setup]
    runs-on: ubuntu-latest
    # Throwaway Postgres service — no external secrets needed. DB-gated
    # integration tests skip themselves when they detect a non-seeded DB;
    # the nightly workflow covers those against a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feastpot
          POSTGRES_PASSWORD: feastpot
          POSTGRES_DB: feastpot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feastpot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Prisma datasource reads SUPABASE_DB_URL / SUPABASE_DIRECT_URL (see
      # prisma/schema.prisma), NOT DATABASE_URL / DIRECT_URL.
      SUPABASE_DB_URL: postgresql://feastpot:feastpot@localhost:5432/feastpot_test
      SUPABASE_DIRECT_URL: postgresql://feastpot:feastpot@localhost:5432/feastpot_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: npm ci
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Create Supabase roles (migrations GRANT to them; vanilla Postgres lacks them)
        run: |
          PGPASSWORD=feastpot psql -h localhost -U feastpot -d feastpot_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE ROLE supabase_auth_admin NOLOGIN;"
      - name: Apply migrations from scratch (from-scratch validation)
        # Failure here means either (a) a migration ordering problem — one migration
        # references an object created by a later one — or (b) schema drift that
        # slipped past the drift-check job.  To diagnose, run locally:
        #   npx prisma migrate diff --from-migrations ./prisma/migrations \
        #     --to-schema-datamodel ./prisma/schema.prisma \
        #     --shadow-database-url <local-empty-postgres-url> --exit-code
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma
      - name: Run tests with coverage
        # Only workspaces with real Jest suites belong in this coverage gate.
        # The vendor workspace has an e2e-only echo script, so including it
        # would make test discovery appear healthy without running assertions.
        run: npx turbo run test --filter=@feastpot/api --filter=@feastpot/web -- --coverage --ci
      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ----------------------------------------------------------------------------
  # 6. Financial suite - a named release gate for money-moving invariants.
  #    Uses a fresh Postgres database so concurrency and ledger tests execute
  #    rather than silently skipping.
  # ----------------------------------------------------------------------------
  financial-suite:
    name: Financial suite
    needs: [setup]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feastpot
          POSTGRES_PASSWORD: feastpot
          POSTGRES_DB: feastpot_financial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feastpot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      SUPABASE_DB_URL: postgresql://feastpot:feastpot@localhost:5432/feastpot_financial
      SUPABASE_DIRECT_URL: postgresql://feastpot:feastpot@localhost:5432/feastpot_financial
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Create Supabase roles
        run: |
          PGPASSWORD=feastpot psql -h localhost -U feastpot -d feastpot_financial -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE ROLE supabase_auth_admin NOLOGIN;"
      - name: Apply migrations from scratch
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma
      - name: Run financial permutation and concurrency suite
        run: npm run test:financial --workspace=@feastpot/api

  # ----------------------------------------------------------------------------
  # 7. E2E - Playwright suite covering every configured vendor project. The
  #    discovery guard machine-checks every checked-in spec and all configured
  #    projects before a server or browser is started.
  #
  #    REGRESSION GUARD: D3 asserts that the saved postcode chip set is what
  #    governs vendor discoverability (not the radius field alone). The job
  #    fails loudly if D3 is skipped, ensuring this can never pass silently.
  #
  #    BRANCH PROTECTION: after this job appears in the Checks tab for the
  #    first time, add "e2e-vendor" to the required status checks for `main`
  #    in GitHub > Settings > Branches > Branch protection rules.
  # ----------------------------------------------------------------------------
  e2e-vendor:
    name: E2E (vendor authoritative lifecycle)
    needs: [setup, e2e-customer]
    runs-on: ubuntu-latest
    env:
      # Vendor dev server origin consumed by Playwright.
      PLAYWRIGHT_BASE_URL: http://localhost:3002
      # Auth credentials for the pre-seeded test vendor account.
      # Fork PRs do not receive secrets, so this required gate fails loudly
      # rather than reporting a green skipped suite.
      TEST_VENDOR_EMAIL: ${{ secrets.TEST_VENDOR_EMAIL }}
      TEST_VENDOR_PASSWORD: ${{ secrets.TEST_VENDOR_PASSWORD }}
      # D3 integration credentials. D3 hits the real dev-environment NestJS
      # API to confirm the saved chip set appears in live customer search.
      # The job fails if either is absent and D3 ends up skipped.
      TEST_API_URL: ${{ secrets.TEST_API_URL }}
      # The vendor browser must call the same isolated API as API-backed E2E
      # assertions. Next.js only exposes this value to client-side code with
      # the NEXT_PUBLIC_ prefix.
      NEXT_PUBLIC_API_URL: ${{ secrets.TEST_API_URL }}
      TEST_VENDOR_ID: ${{ secrets.TEST_VENDOR_ID }}
      # Vendor Next.js app runtime vars.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Factory-backed vendor state and authorization projects.
      SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_FACTORY_PASSWORD: ${{ secrets.TEST_FACTORY_PASSWORD }}
      TEST_FACTORY_NAMESPACE: vendor-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@10.9.4

      - run: npm ci --no-audit --no-fund

      - name: Verify vendor Playwright discovery (noninteractive)
        run: npm run test:e2e:discovery --workspace=@feastpot/vendor

      - name: Require vendor E2E credentials
        run: |
          required=(
            TEST_VENDOR_EMAIL TEST_VENDOR_PASSWORD TEST_API_URL NEXT_PUBLIC_API_URL TEST_VENDOR_ID
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_DB_URL SUPABASE_SERVICE_ROLE_KEY TEST_FACTORY_PASSWORD
            TEST_FACTORY_NAMESPACE
          )
          missing=()
          for key in "${required[@]}"; do
            [ -n "${!key}" ] || missing+=("$key")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Vendor E2E credentials missing::Required credentials are absent: ${missing[*]}. This check intentionally fails instead of skipping."
            exit 1
          fi
          if [ "$NEXT_PUBLIC_API_URL" != "$TEST_API_URL" ]; then
            echo "::error title=Vendor E2E API mismatch::NEXT_PUBLIC_API_URL must match TEST_API_URL so the browser and API-backed E2E checks use the same environment."
            exit 1
          fi

      # ---- Prisma client ------------------------------------------------------
      # The vendor app's shared packages may reference Prisma types at build
      # time. Generate the client with dummy URLs (no DB connection is made).
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          SUPABASE_DB_URL: postgresql://dummy:dummy@localhost:5432/dummy
          SUPABASE_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy

      # ---- Browser setup ------------------------------------------------------
      # install-chromium.js replaces Playwright's downloaded binary with a
      # symlink to the system Chromium on NixOS/Replit where the downloaded
      # binary crashes due to missing glibc paths. On ubuntu-latest the binary
      # installed by `playwright install` is already correctly linked, so this
      # step may be a harmless no-op. continue-on-error prevents a hard stop
      # if `which chromium` cannot locate a system binary on this runner.
      - name: Run install-chromium.js (NixOS symlink helper, may be no-op)
        run: node apps/vendor/e2e/install-chromium.js
        continue-on-error: true

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps chromium
        working-directory: apps/vendor

      # ---- Vendor dev server --------------------------------------------------
      - name: Start vendor dev server on port 3002 (background)
        run: npm run dev --workspace=@feastpot/vendor &

      - name: Wait for vendor dev server (timeout 120 s)
        run: |
          echo "Polling http://localhost:3002 ..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3002 > /dev/null 2>&1; then
              echo "Vendor dev server ready (attempt ${i}/60)."
              exit 0
            fi
            echo "  [${i}/60] not ready - retrying in 2 s"
            sleep 2
          done
          echo "::error title=Dev server timeout::Vendor dev server did not open port 3002 within 120 s. Inspect the Next.js startup output above for compilation errors or missing environment variables."
          exit 1

      # ---- Playwright (authoritative lifecycle projects) ---------------------
      # The older mocked UX projects remain discoverable and runnable locally.
      # This required gate runs the factory-backed state, authorization, menu,
      # order, and lifecycle evidence projects added for this acceptance suite.
      - name: Clear stale vendor Playwright results
        run: rm -f apps/vendor/e2e-results.json

      - name: Run authoritative vendor lifecycle projects
        id: playwright-run
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test \
            --project=vendor-state-matrix-setup \
            --project=vendor-state-matrix \
            --project=vendor-state-matrix-mobile \
            --project=vendor-authorization \
            --project=vendor-order-contracts \
            --project=vendor-menu-contracts \
            --project=vendor-lifecycle-evidence \
            --project=vendor-state-matrix-teardown
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: apps/vendor

      - name: Validate every authoritative vendor project executed
        if: always()
        run: node scripts/validate-playwright-results.mjs --results apps/vendor/e2e-results.json --expected-project-count 8

      # ---- Artefact upload ----------------------------------------------------
      # Upload the HTML report (with traces and screenshots) only on failure so
      # developers can inspect exactly which assertion failed and replay the
      # browser trace without re-running locally.
      - name: Preserve vendor Playwright failure status
        if: always() && steps.playwright-run.outputs.exit_code != '0'
        run: exit "${{ steps.playwright-run.outputs.exit_code }}"

      - name: Upload vendor Playwright results and HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-playwright-report-${{ github.run_id }}
          path: |
            apps/vendor/e2e-results.json
            apps/vendor/e2e-report/
          retention-days: 14

  # --------------------------------------------------------------------------
  # Admin portal E2E is a separate required check. Missing credentials fail
  # loudly so branch protection can never treat an unexecuted suite as green.
  # --------------------------------------------------------------------------
  e2e-admin:
    name: E2E (admin portal, all projects)
    needs: [setup, e2e-customer]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3003
      TEST_API_URL: ${{ secrets.TEST_API_URL }}
      NEXT_PUBLIC_API_URL: ${{ secrets.TEST_API_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_FACTORY_PASSWORD: ${{ secrets.TEST_FACTORY_PASSWORD }}
      TEST_FACTORY_NAMESPACE: admin-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_URL: redis://localhost:6379
      STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      SESSION_SECRET: admin-e2e-test-only-session-secret-34125348434
      ADMIN_REQUIRE_AAL2: 'true'
      NEXT_PUBLIC_ADMIN_REQUIRE_AAL2: 'true'
      ADMIN_E2E_ALLOW_AAL1: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: npm ci --no-audit --no-fund
      - name: Verify admin Playwright discovery (noninteractive)
        run: npm run test:e2e:discovery --workspace=@feastpot/admin
      - name: Require admin E2E credentials
        run: |
          required=(
            TEST_API_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
            TEST_ADMIN_EMAIL TEST_ADMIN_PASSWORD
            SUPABASE_DB_URL SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
            TEST_FACTORY_PASSWORD TEST_FACTORY_NAMESPACE REDIS_URL STRIPE_SECRET_KEY_TEST
            SESSION_SECRET
          )
          missing=()
          for key in "${required[@]}"; do
            [ -n "${!key}" ] || missing+=("$key")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Admin E2E credentials missing::Required credentials are absent: ${missing[*]}. This check intentionally fails instead of skipping."
            exit 1
          fi
          if [ "$NEXT_PUBLIC_API_URL" != "$TEST_API_URL" ]; then
            echo "::error title=Admin E2E API mismatch::NEXT_PUBLIC_API_URL must match TEST_API_URL so browser checks use the verified API."
            exit 1
          fi
      - name: Verify admin E2E API health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${TEST_API_URL%/}/healthz" > /dev/null
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          SUPABASE_DB_URL: postgresql://dummy:dummy@localhost:5432/dummy
          SUPABASE_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
      - name: Run authoritative admin action acceptance
        run: npm run test --workspace=@feastpot/api -- --runInBand --forceExit src/e2e/admin-authoritative-actions.spec.ts
        env:
          NODE_ENV: test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - name: Start admin server
        run: npm run dev --workspace=@feastpot/admin &
      - name: Wait for admin server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3003 > /dev/null && exit 0
            sleep 2
          done
          echo "::error title=Admin server timeout::The admin app did not open port 3003."
          exit 1
      - name: Clear stale admin Playwright results
        run: rm -f apps/admin/e2e-results.json
      - name: Run every admin Playwright project
        id: playwright-run
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: apps/admin
      - name: Validate every admin project executed
        if: always()
        run: node scripts/validate-playwright-results.mjs --results apps/admin/e2e-results.json --expected-project-count 9
      - name: Preserve admin Playwright failure status
        if: always() && steps.playwright-run.outputs.exit_code != '0'
        run: exit "${{ steps.playwright-run.outputs.exit_code }}"
      - name: Upload admin Playwright results and HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-report-${{ github.run_id }}
          path: |
            apps/admin/e2e-results.json
            apps/admin/e2e-report/
          retention-days: 14

  # --------------------------------------------------------------------------
  # Customer checkout is intentionally a separate required check. Unlike
  # vendor e2e, this job must never turn missing payment credentials into a
  # green "skipped" result: it creates one real Stripe test-mode order.
  # Configure the listed values as repository secrets for the isolated test
  # environment only; no secret is written to the repository or artefacts.
  # Add "e2e-customer" to the branch-protection required checks for main.
  # --------------------------------------------------------------------------
  e2e-customer:
    name: E2E (customer checkout)
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      TEST_API_URL: ${{ secrets.TEST_API_URL }}
      NEXT_PUBLIC_API_URL: ${{ secrets.TEST_API_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.TEST_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_FACTORY_PASSWORD: ${{ secrets.TEST_FACTORY_PASSWORD }}
      TEST_FACTORY_NAMESPACE: customer-${{ github.run_id }}-${{ github.run_attempt }}
      CUSTOMER_E2E_USE_FACTORY: 'true'
      CUSTOMER_E2E_ISOLATED_ENVIRONMENT: 'true'
      # Keep the safety allowlist identical to the API this job exercises.
      CUSTOMER_E2E_ALLOWED_API_ORIGIN: ${{ secrets.TEST_API_URL }}
      CUSTOMER_E2E_ALLOWED_SUPABASE_REF: ${{ vars.CUSTOMER_E2E_ALLOWED_SUPABASE_REF }}
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: npm ci --no-audit --no-fund
      - name: Verify customer Playwright discovery (noninteractive)
        run: npm run test:e2e:discovery --workspace=@feastpot/web
      - name: Require isolated customer and Stripe test credentials
        run: |
          required=(
            TEST_API_URL NEXT_PUBLIC_API_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY STRIPE_SECRET_KEY_TEST
            SUPABASE_DB_URL SUPABASE_SERVICE_ROLE_KEY TEST_FACTORY_PASSWORD
            TEST_FACTORY_NAMESPACE CUSTOMER_E2E_USE_FACTORY CUSTOMER_E2E_ISOLATED_ENVIRONMENT
            CUSTOMER_E2E_ALLOWED_API_ORIGIN CUSTOMER_E2E_ALLOWED_SUPABASE_REF
          )
          missing=()
          for key in "${required[@]}"; do
            [ -n "${!key}" ] || missing+=("$key")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Customer E2E credentials missing::Required credentials are absent: ${missing[*]}. This check intentionally fails instead of skipping."
            exit 1
          fi
          case "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" in
            pk_test_*) ;;
            *) echo "::error title=Unsafe Stripe key::TEST_STRIPE_PUBLISHABLE_KEY must be a Stripe pk_test_ key."; exit 1 ;;
          esac
          case "$STRIPE_SECRET_KEY_TEST" in
            sk_test_*) ;;
            *) echo "::error title=Unsafe Stripe key::STRIPE_SECRET_KEY_TEST must be an sk_test_ key."; exit 1 ;;
          esac
      - name: Verify isolated customer API health
        shell: bash
        run: |
          set -euo pipefail
          api_health_url="${TEST_API_URL%/}/healthz"
          echo "Checking configured customer E2E API health endpoint..."
          curl --fail --silent --show-error --max-time 15 --retry 2 --retry-all-errors \
            "$api_health_url" > /tmp/customer-e2e-api-health.json
          node -e "
            const health = JSON.parse(require('node:fs').readFileSync('/tmp/customer-e2e-api-health.json', 'utf8'));
            if (!['ok', 'degraded'].includes(health.status)) {
              throw new Error('Customer E2E API health response was unavailable.');
            }
          "
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          SUPABASE_DB_URL: postgresql://dummy:dummy@localhost:5432/dummy
          SUPABASE_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start customer web server
        run: npm run dev --workspace=@feastpot/web &
      - name: Wait for customer web server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Prewarming customer sign-in route..."
              curl -sf --max-time 240 'http://localhost:3000/sign-in?next=/checkout' > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Customer server timeout::The customer app did not open port 3000."
          exit 1
      - name: Run deterministic customer suite and real Stripe smoke
        id: playwright-run
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test --config playwright.config.ts e2e/customer
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: apps/web
      - name: Assert CP-1 real purchase was discovered and executed
        if: always()
        shell: bash
        run: |
          node - <<'NODE_SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const resultsFile = path.join('apps', 'web', 'e2e-results.json');
          if (!fs.existsSync(resultsFile)) {
            console.error('::error title=Missing customer results::e2e-results.json not found; CP-1 execution cannot be verified.');
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
          let cp1Found = false;
          let cp1Executed = false;
          let cp1Skipped = false;

          function walk(suite) {
            for (const spec of suite.specs ?? []) {
              if (!spec.title.includes('CP-1:')) continue;
              cp1Found = true;
              for (const test of spec.tests ?? []) {
                const results = test.results ?? [];
                if (results.length === 0 || results.every((result) => result.status === 'skipped')) {
                  cp1Skipped = true;
                }
                if (results.some((result) => result.status !== 'skipped')) {
                  cp1Executed = true;
                }
              }
            }
            for (const child of suite.suites ?? []) walk(child);
          }
          walk(report);

          if (!cp1Found) {
            console.error('::error title=CP-1 absent::CP-1 real purchase was not discovered in the customer Playwright result.');
            process.exit(1);
          }
          if (!cp1Executed || cp1Skipped) {
            console.error('::error title=CP-1 not executed::CP-1 real purchase was skipped or had no execution result.');
            process.exit(1);
          }
          console.log('CP-1 real purchase was discovered, executed, and not skipped.');
          NODE_SCRIPT
      - name: Preserve customer Playwright failure status
        if: always() && steps.playwright-run.outputs.exit_code != '0'
        run: exit "${{ steps.playwright-run.outputs.exit_code }}"
      - name: Upload customer Playwright report
        if: always() && steps.playwright-run.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: customer-playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 8. RLS coverage check - connects to the real development database and
  #    confirms every table in the public schema has rowsecurity=true. Fails
  #    if any new table was added without enabling RLS. Separately, runs the
  #    denial test script with the anon key to prove the supabase PostgREST
  #    layer actually blocks reads of sensitive tables.
  #    Skipped on fork PRs (no secrets available).
  # ----------------------------------------------------------------------------
  rls-check:
    name: RLS coverage + denial tests
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip notice for fork PRs (secrets unavailable)
        id: fork-guard
        if: env.SUPABASE_DIRECT_URL == ''
        run: |
          echo "::notice title=RLS check skipped (fork PR)::Repository secrets are not available to fork-originated workflows. The RLS coverage and denial tests are skipped. A maintainer will trigger the full suite after reviewing the changes."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Install psql client
        if: steps.fork-guard.outputs.skip != 'true'
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Check every public table has RLS enabled
        if: steps.fork-guard.outputs.skip != 'true'
        # Runs scripts/check-rls-coverage.sql which raises an exception (and
        # therefore exits non-zero via ON_ERROR_STOP=1) if any table in the
        # public schema has rowsecurity=false and is not in the allowlist.
        # A new table reaching the dev database without RLS will fail this job
        # before the PR can be merged.
        run: psql "$SUPABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/check-rls-coverage.sql

      - uses: actions/setup-node@v5
        if: steps.fork-guard.outputs.skip != 'true'
        with:
          node-version: 22

      - name: RLS denial tests (anon key, never service key)
        if: steps.fork-guard.outputs.skip != 'true'
        # Uses the Supabase anon key - the key that is public by design and
        # shipped in every browser bundle - to assert that sensitive tables
        # return zero rows through the PostgREST API. A test using service_role
        # would bypass RLS and prove nothing.
        run: node scripts/test-rls-denial.mjs

  # ----------------------------------------------------------------------------
  # 8. Build - only after every quality gate has passed.
  # ----------------------------------------------------------------------------
  build:
    name: Build all apps
    needs: [typecheck, lint, prisma-validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: npm ci
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build (api, web, vendor, admin)
        run: npx turbo run build
